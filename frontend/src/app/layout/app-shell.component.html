<mat-sidenav-container class="shell" dir="rtl">
  <mat-sidenav class="sidebar" mode="side" opened position="end">
    <div class="brand">
      <div class="brand-icon"><mat-icon>hub</mat-icon></div>
      <div>
        <strong>سامانه دموی بانکداری متمرکز</strong>
        <small>Core Banking Prototype</small>
      </div>
    </div>

    <div class="menu-section-label">عملیات</div>
    <mat-nav-list class="section-list">
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>داشبورد</span>
      </a>
      <a mat-list-item routerLink="/cif/parties" routerLinkActive="active-link">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>مدیریت مشتری / CIF</span>
      </a>
    </mat-nav-list>

    <div class="menu-section-label">داده‌های مرجع</div>
    <mat-nav-list class="section-list reference-root-menu">
      <a mat-list-item routerLink="/reference-data" [class.active-link]="isReferenceSection()">
        <mat-icon matListItemIcon>dataset</mat-icon>
        <span matListItemTitle>اطلاعات پایه</span>
      </a>
    </mat-nav-list>

    <div class="menu-section-label">مدیریت و سیستم</div>
    <mat-nav-list class="section-list">
      <a mat-list-item routerLink="/system-specification" routerLinkActive="active-link">
        <mat-icon matListItemIcon>info</mat-icon>
        <span matListItemTitle>مشخصات فنی سیستم</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <span class="title">سامانه دموی بانکداری متمرکز</span>
      <span class="spacer"></span>

      <a mat-button class="technical-link" routerLink="/system-specification">
        <mat-icon>info</mat-icon>
        <span>مشخصات فنی</span>
      </a>

      <button mat-stroked-button class="theme-trigger" [matMenuTriggerFor]="themeMenu"
              [matTooltip]="theme.label()" aria-label="تغییر تم">
        <mat-icon>{{ theme.icon() }}</mat-icon>
        <span>{{ theme.label() }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #themeMenu="matMenu" xPosition="before">
        <button mat-menu-item (click)="setTheme('light')">
          <mat-icon>light_mode</mat-icon>
          <span>روشن</span>
          @if (theme.isSelected('light')) { <mat-icon class="selected-theme">check</mat-icon> }
        </button>
        <button mat-menu-item (click)="setTheme('dark')">
          <mat-icon>dark_mode</mat-icon>
          <span>تیره</span>
          @if (theme.isSelected('dark')) { <mat-icon class="selected-theme">check</mat-icon> }
        </button>
        <button mat-menu-item (click)="setTheme('system')">
          <mat-icon>desktop_windows</mat-icon>
          <span>هماهنگ با سیستم</span>
          @if (theme.isSelected('system')) { <mat-icon class="selected-theme">check</mat-icon> }
        </button>
      </mat-menu>

      <span class="version-chip">{{ version }}</span>
      <div class="user-chip">
        <mat-icon>account_circle</mat-icon>
        <span>کاربر مدیر</span>
      </div>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
