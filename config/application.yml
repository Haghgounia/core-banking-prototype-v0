# Runtime configuration for the local prototype environment.
spring:
  datasource:
    url: jdbc:oracle:thin:@//10.1.60.51:1522/FREEPDB1
    username: SYSTEM
    password: Oracle123
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 15000
      validation-timeout: 5000

  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 96MB

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

core-banking:
  organization:
    locations:
      # R4: legacy three-table reconciliation endpoints are DBA-only and disabled by default.
      # Leave false after renaming ORG.LOCATIONS / ORG.POSTAL_ADDRESSES.
      legacy-review-enabled: ${ORG_LEGACY_LOCATION_REVIEW_ENABLED:false}
    contacts:
      # R5-C2: default legacy-named bean now reads OUCP snapshot directly.
      # Explicit mode=canonical still selects the older V2 pilot; do not activate it.
      # Contact source cutover is independently gated by ORG_CONTACT_UNIT_WRITES_ENABLED.
      storage-mode: ${ORG_CONTACT_STORAGE_MODE:legacy}
      # Additional explicit opt-in; leave false until controlled post-cutover UAT.
      canonical-writes-enabled: ${ORG_CONTACT_CANONICAL_WRITES_ENABLED:false}
      unit-writes-enabled: ${ORG_CONTACT_UNIT_WRITES_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  schemas:
    reference-data: GEO
    deposit-product-factory: DPS
    deposit-opening: DPS2
    deposit-account: DPS2
    cif: CIF
    party-reference: CIF
    fee: FEE
    fee2: FEE2
    calendar: CAL
    calendar2: CAL2
  database-export:
    enabled: false
    schema: DPS
    table-prefix: REF_
    output-directory: database/oracle/exports
logging:
  file:
    name: logs/core-banking-prototype.log
  level:
    root: INFO
    com.behsazan.corebanking: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10
      total-size-cap: 200MB

