# Independent CLT R1A properties; no modification to shared application.yml.
# Opt-in SELECT-only reader. The initial state is DENY ALL for /api/v1/collateral/**.
core-banking.collateral.r1a.reads-enabled=${CLT_R1A_READS_ENABLED:false}
core-banking.collateral.r1a.issuer=${CLT_R1A_ISSUER:}
core-banking.collateral.r1a.jwks-uri=${CLT_R1A_JWKS_URI:}
core-banking.collateral.r1a.audience=${CLT_R1A_AUDIENCE:}
core-banking.collateral.r1a.max-token-lifetime-seconds=${CLT_R1A_MAX_TOKEN_LIFETIME_SECONDS:3600}
core-banking.collateral.r1a.jdbc-url=${CLT_R1A_JDBC_URL:}
core-banking.collateral.r1a.jdbc-username=${CLT_R1A_JDBC_USERNAME:}
core-banking.collateral.r1a.jdbc-password=${CLT_R1A_JDBC_PASSWORD:}
