core-banking.collateral.posting.allocation-transaction-type=${CLT_POSTING_ALLOCATION_TXN_TYPE:}
core-banking.collateral.posting.unallocation-transaction-type=${CLT_POSTING_UNALLOCATION_TXN_TYPE:}
core-banking.collateral.posting.posted-transaction-status=${CLT_POSTING_POSTED_TXN_STATUS:}
core-banking.collateral.posting.allocation-direction=${CLT_POSTING_ALLOCATION_DIRECTION:}
core-banking.collateral.posting.unallocation-direction=${CLT_POSTING_UNALLOCATION_DIRECTION:}
core-banking.collateral.posting.allocatable-collateral-statuses=${CLT_POSTING_ALLOCATABLE_STATUSES:}
