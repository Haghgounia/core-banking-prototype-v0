core-banking.collateral.unallocation.module-ids.guarantee=${CLT_UNALLOCATION_MODULE_GUARANTEE:}
core-banking.collateral.unallocation.module-ids.letter-of-credit=${CLT_UNALLOCATION_MODULE_LC:}
core-banking.collateral.unallocation.module-ids.green-license=${CLT_UNALLOCATION_MODULE_GREEN:}
# R5A has no financial writer toggle because there is no unallocation writer.
