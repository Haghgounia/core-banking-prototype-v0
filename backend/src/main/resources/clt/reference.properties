# Stable CLT Reference configuration. R1A env vars remain read-only aliases for compatibility.
# Both read and write planes default to disabled. Never commit live credentials.
core-banking.collateral.reference.reads-enabled=${CLT_REFERENCE_READS_ENABLED:${CLT_R1A_READS_ENABLED:false}}
core-banking.collateral.reference.issuer=${CLT_REFERENCE_ISSUER:${CLT_R1A_ISSUER:}}
core-banking.collateral.reference.jwks-uri=${CLT_REFERENCE_JWKS_URI:${CLT_R1A_JWKS_URI:}}
core-banking.collateral.reference.audience=${CLT_REFERENCE_AUDIENCE:${CLT_R1A_AUDIENCE:}}
core-banking.collateral.reference.max-token-lifetime-seconds=${CLT_REFERENCE_MAX_TOKEN_LIFETIME_SECONDS:${CLT_R1A_MAX_TOKEN_LIFETIME_SECONDS:3600}}
core-banking.collateral.reference.jdbc-url=${CLT_REFERENCE_JDBC_URL:${CLT_R1A_JDBC_URL:}}
core-banking.collateral.reference.jdbc-username=${CLT_REFERENCE_JDBC_USERNAME:${CLT_R1A_JDBC_USERNAME:}}
core-banking.collateral.reference.jdbc-password=${CLT_REFERENCE_JDBC_PASSWORD:${CLT_R1A_JDBC_PASSWORD:}}
core-banking.collateral.reference.writes-enabled=${CLT_REFERENCE_WRITES_ENABLED:false}
core-banking.collateral.reference.writer-jdbc-url=${CLT_REFERENCE_WRITER_JDBC_URL:}
core-banking.collateral.reference.writer-jdbc-username=${CLT_REFERENCE_WRITER_JDBC_USERNAME:}
core-banking.collateral.reference.writer-jdbc-password=${CLT_REFERENCE_WRITER_JDBC_PASSWORD:}
